name: GitHub Trend Radar — Weekly Report

on:
  schedule:
    # 08:00 Monday Asia/Ho_Chi_Minh (UTC+7)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-trend-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build weekly report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.radar
      - name: Commit report files (only when changed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ reports/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update weekly GitHub trends"
            git push
          else
            echo 'No changes to commit'
          fi
